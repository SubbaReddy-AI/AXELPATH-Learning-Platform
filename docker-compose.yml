services:
  mysql:
    image: mysql:8.0
    container_name: axelpath_mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-axelpath_db}
      MYSQL_USER: ${MYSQL_USER:-axelpath}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-Password}

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - axelpath_network

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-p${MYSQL_ROOT_PASSWORD:-Password}"
        ]
      timeout: 20s
      interval: 10s
      retries: 10
      start_period: 30s


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: axelpath_backend
    restart: unless-stopped

    env_file:
      - ./backend/.env

    environment:
      DATABASE_URL: mysql+mysqlconnector://${MYSQL_USER:-axelpath}:${MYSQL_PASSWORD:-Password}@mysql:3306/${MYSQL_DATABASE:-axelpath_db}
      MEDIA_ROOT: /app/media
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/google-service-account.json

    ports:
      - "8000:8000"

    volumes:
      - ./media:/app/media
      - ./backend:/app
      - ./backend/google-service-account.json:/run/secrets/google-service-account.json:ro

    networks:
      - axelpath_network

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('https://qodekraft-learning-platform.onrender.com/api/v1/health', timeout=5).read()"
        ]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

    depends_on:
      mysql:
        condition: service_healthy


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: axelpath_frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - axelpath_network


volumes:
  mysql_data:


networks:
  axelpath_network:
    driver: bridge